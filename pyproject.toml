[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rate_truth"
version = "0.1.0"
description = "Real OSM hotels with a deterministic, explicitly synthetic supplier"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.12",
  "httpx>=0.28.1",
  "pydantic>=2.11.4",
  "PyYAML>=6.0.2",
  "uvicorn>=0.34.2",
  "mcp>=2.3.0,<3",
  "lxml>=6.1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.5", "ruff>=0.11.9", "jsonschema>=4.23"]
rag = ["fastembed>=0.9.1", "numpy>=2.3"]

[tool.setuptools.packages.find]
include = ["rate_truth*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = ".local/pytest-cache"

[tool.ruff]
target-version = "py312"
line-length = 100
cache-dir = ".local/ruff-cache"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
