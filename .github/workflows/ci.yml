name: CI
on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      RATE_TRUTH_LLM_MODE: replay
      RATE_TRUTH_RETRIEVAL: bm25
      HF_HUB_OFFLINE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "requirements*.txt"
      - run: pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m pytest -q -p no:cacheprovider --basetemp=.local/pt-m5-ci
      - run: python scripts/render_readme.py --check
      - run: python eval/run_eval.py --mode replay --run-id ci-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-replay-smoke
          path: |
            eval/raw/ci-smoke/
            eval/results.json
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      LIVE_API: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npm run e2e -- --project=desktop --project=phone
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failures
          path: site/test-results/
